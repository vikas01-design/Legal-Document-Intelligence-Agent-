services:
  - type: web
    name: legal-doc-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ENKRYPT_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: PORT
        value: "3001"
    healthCheckPath: /api/health
